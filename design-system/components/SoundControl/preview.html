<!doctype html>
<html>
<head><meta charset="utf-8"><title>SoundControl</title>
<style>html,body{margin:0} body{background:var(--deep);padding:20px;} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style>
</head>
<body class="cu-root">
<div class="row"><div class="cu-sound cu-facet" role="group" aria-label="Sound"><button class="cu-sound__toggle" type="button" aria-pressed="true">sound on</button><input class="cu-sound__volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume"></div><div class="cu-sound cu-facet" role="group" aria-label="Sound"><button class="cu-sound__toggle" type="button" aria-pressed="false">sound off</button><input class="cu-sound__volume" type="range" min="0" max="1" step="0.01" value="0.2" aria-label="Volume"></div></div>
</body>
</html>
