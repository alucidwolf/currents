<!doctype html>
<html>
<head><meta charset="utf-8"><title>Panel</title>
<style>html,body{margin:0} body{background:var(--deep);padding:20px;} .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}</style>
</head>
<body class="cu-root">
<div class="cu-lift"><div class="cu-panel cu-facet" role="dialog" aria-label="Choose an animal"><h2 class="cu-panel__title">Be something else</h2><div class="cu-panel__choices"><button class="cu-card cu-facet" type="button" aria-pressed="false"><span class="cu-key cu-facet">1</span><span class="cu-card__name">Humpback Whale</span><span class="cu-card__blurb">Vast and unhurried. Turns like a continent.</span></button><button class="cu-card cu-facet" type="button" aria-pressed="false"><span class="cu-key cu-facet">2</span><span class="cu-card__name">Dolphin</span><span class="cu-card__blurb">Quick, curious, never quite still.</span></button><button class="cu-card cu-facet" type="button" aria-pressed="true"><span class="cu-key cu-facet">3</span><span class="cu-card__name">Manta Ray</span><span class="cu-card__blurb">All wing. Flies more than it swims.</span></button><button class="cu-card cu-facet" type="button" aria-pressed="false"><span class="cu-key cu-facet">4</span><span class="cu-card__name">Sea Turtle</span><span class="cu-card__blurb">Rows along in no particular hurry.</span></button></div><p class="cu-panel__foot">The swim carries on — you keep your place, heading and speed.</p></div></div>
</body>
</html>
